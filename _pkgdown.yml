url: https://gcol33.github.io/SIMP
template:
  bootstrap: 5
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
      <script>
      (function () {
        var p = window.location.pathname;
        var from = "/articles/simp.html";
        if (p.slice(-from.length) === from) {
          window.location.replace(p.slice(0, -from.length) + "/articles/SIMP.html" +
            window.location.search + window.location.hash);
        }
      })();
      </script>

navbar:
  structure:
    left:
    - intro
    - reference
    - news
    right:
    - search
    - github
    - lightswitch
figures:
  dev: svglite
  fig.ext: svg
  bg: '#FFFFFF'
reference:
- title: Integrate
  desc: Advance a Hamiltonian trajectory.
  contents:
  - simp_integrate
  - simp_integrate_nonsep
  - simp_integrate_mts
- title: Sample
  desc: Hamiltonian Monte Carlo built on the integrators.
  contents: simp_hmc
- title: Schemes
  desc: The available integrators.
  contents:
  - simp_schemes
  - simp_b_optimal
