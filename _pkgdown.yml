url: https://gcol33.github.io/SIMP
template:
  bootstrap: 5
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite
  fig.ext: svg
  bg: '#FFFFFF'
reference:
- title: Integrate
  desc: Advance a Hamiltonian trajectory.
  contents:
  - simp_integrate
  - simp_integrate_nonsep
  - simp_integrate_mts
- title: Sample
  desc: Hamiltonian Monte Carlo built on the integrators.
  contents: simp_hmc
- title: Schemes
  desc: The available integrators.
  contents:
  - simp_schemes
  - simp_b_optimal
articles:
- title: Get started
  navbar: ~
  contents: simp
